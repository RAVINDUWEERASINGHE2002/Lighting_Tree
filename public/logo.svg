<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#166443" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D9967"/>
      <stop offset="60%" stop-color="#166443"/>
      <stop offset="100%" stop-color="#0F402D"/>
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B89028"/>
      <stop offset="100%" stop-color="#664A21"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Halo -->
  <circle cx="100" cy="100" r="92" fill="#0A3324" stroke="#D4AF37" stroke-width="2.5" stroke-dasharray="4 2"/>
  <circle cx="100" cy="100" r="82" fill="url(#sunGlow)"/>

  <!-- Tree Trunk & Roots -->
  <path d="M93 148 C93 125 82 110 88 95 C90 90 98 86 100 86 C102 86 110 90 112 95 C118 110 107 125 107 148 C115 152 125 155 130 157 C122 154 114 152 105 151 C100 151 95 151 90 152 C82 154 75 157 70 158 C75 155 85 152 93 148 Z" fill="url(#trunkGrad)"/>
  <path d="M96 115 C90 108 80 105 72 107 C80 107 88 111 94 118 Z" fill="#664A21"/>
  <path d="M104 115 C110 108 120 105 128 107 C120 107 112 111 106 118 Z" fill="#664A21"/>

  <!-- Foliage Canopy (Layers of stylized leafy clouds) -->
  <!-- Bottom canopy -->
  <path d="M52 115 C45 105 48 90 60 84 C62 72 75 64 88 68 C94 56 110 54 120 62 C130 56 144 62 148 74 C158 78 162 92 154 102 C160 112 152 124 140 126 C132 127 126 122 122 118 C116 125 102 126 95 120 C88 126 76 125 70 118 C65 122 55 121 52 115 Z" fill="url(#treeGrad)"/>

  <!-- Mid canopy highlights -->
  <path d="M68 95 C62 88 66 76 75 73 C80 64 92 60 100 66 C108 58 122 60 128 68 C136 72 138 84 132 92 C126 88 118 88 112 92 C104 86 92 88 86 94 C80 92 72 92 68 95 Z" fill="#2D9967" opacity="0.85"/>

  <!-- Top canopy cluster -->
  <ellipse cx="100" cy="62" rx="22" ry="16" fill="#3DB97F" opacity="0.6"/>

  <!-- Golden String Lights / Lanterns -->
  <!-- Wire paths draped through branches -->
  <path d="M58 92 Q80 105 100 90 Q120 105 142 92" stroke="#E4BC5E" stroke-width="1.2" stroke-dasharray="2 1" fill="none" opacity="0.7"/>
  <path d="M72 78 Q100 95 128 78" stroke="#E4BC5E" stroke-width="1" stroke-dasharray="2 1" fill="none" opacity="0.6"/>

  <!-- Glowing Light Bulbs -->
  <!-- Bottom string lights -->
  <circle cx="58" cy="92" r="3.5" fill="#FFFBEB" filter="url(#glow)"/>
  <circle cx="58" cy="92" r="2" fill="#D4AF37"/>

  <circle cx="76" cy="100" r="4" fill="#FFFBEB" filter="url(#glow)"/>
  <circle cx="76" cy="100" r="2.2" fill="#FCD34D"/>

  <circle cx="100" cy="90" r="4.5" fill="#FFFBEB" filter="url(#glow)"/>
  <circle cx="100" cy="90" r="2.5" fill="#FCD34D"/>

  <circle cx="124" cy="100" r="4" fill="#FFFBEB" filter="url(#glow)"/>
  <circle cx="124" cy="100" r="2.2" fill="#FCD34D"/>

  <circle cx="142" cy="92" r="3.5" fill="#FFFBEB" filter="url(#glow)"/>
  <circle cx="142" cy="92" r="2" fill="#D4AF37"/>

  <!-- Higher branch lights -->
  <circle cx="72" cy="78" r="3" fill="#FFFBEB" filter="url(#glow)"/>
  <circle cx="72" cy="78" r="1.8" fill="#FCD34D"/>

  <circle cx="88" cy="85" r="3.8" fill="#FFFBEB" filter="url(#glow)"/>
  <circle cx="88" cy="85" r="2" fill="#FCD34D"/>

  <circle cx="112" cy="85" r="3.8" fill="#FFFBEB" filter="url(#glow)"/>
  <circle cx="112" cy="85" r="2" fill="#FCD34D"/>

  <circle cx="128" cy="78" r="3" fill="#FFFBEB" filter="url(#glow)"/>
  <circle cx="128" cy="78" r="1.8" fill="#FCD34D"/>

  <!-- Top Crown light -->
  <circle cx="100" cy="52" r="4.5" fill="#FFFBEB" filter="url(#glow)"/>
  <circle cx="100" cy="52" r="2.5" fill="#FCD34D"/>

  <!-- Little sparkle stars around tree -->
  <path d="M52 65 Q55 65 55 62 Q55 65 58 65 Q55 65 55 68 Q55 65 52 65 Z" fill="#FCD34D"/>
  <path d="M148 60 Q150 60 150 58 Q150 60 152 60 Q150 60 150 62 Q150 60 148 60 Z" fill="#FCD34D"/>
  <path d="M100 35 Q102 35 102 33 Q102 35 104 35 Q102 35 102 37 Q102 35 100 35 Z" fill="#FCD34D"/>
</svg>
